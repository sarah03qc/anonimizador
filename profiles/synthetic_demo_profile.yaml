name: SYNTHETIC_DEMO_PROFILE
description: "Solo demostración con archivos ficticios. No es un perfil institucional real. Requiere revisión humana."
required_headers: [campo_a, campo_b]
rules:
  - {header: campo_a, action: anonymize, type: Persona}
  - {header: campo_b, action: anonymize, type: Identificación}
  - {header: dato1, action: anonymize, type: Teléfono}
  - {header: dato2, action: anonymize, type: Correo}
  - {header: Nombre, action: anonymize, type: Persona}
  - {header: Cédula, action: anonymize, type: Identificación}
  - {header: Correo, action: anonymize, type: Correo}
  - {header: campo_x, action: anonymize, type: Persona}
  - header: Observaciones
    action: anonymize
    type: Texto libre
    method: Reemplazar contenido completo
  - {header: Región, action: preserve, type: Institucional}
  - {header: Establecimiento, action: preserve, type: Institucional}
